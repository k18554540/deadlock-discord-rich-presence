
[package]
name = "deadlock-discord-presence"
version = "0.1.1"
edition = "2024"
description = "Deadlock Discord Rich Presence"
license = "GPL-3.0"
repository = "https://github.com/k18554540/deadlock-discord-rich-presence"
homepage = "https://github.com/k18554540/deadlock-discord-rich-presence"

[lib]
name = "deadlock_discord_presence"
crate-type = ["rlib"]
path = "src-rs/lib.rs"

[[bin]]
name = "deadlock-discord-presence"
path = "src-rs/main.rs"

[dependencies]
discord-rich-presence = "0.2"
env_logger = "0.11"
log = "0.4"
regex = "1.12.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37.2", features = ["windows"] }
tokio = { version = "1.50.0", features = ["time", "rt-multi-thread", "macros", "signal"] }
ts-rs = { version = "11.1.0", features = ["serde-compat"] }
image = { version = "0.25", default-features = false, features = ["ico"] }
tao = "0.33"
tray-icon = "0.21"

[build-dependencies]
winres = "0.1"